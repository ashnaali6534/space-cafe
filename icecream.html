<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Coffee - Space Cafeteria</title>
  <style>
    img {
      height: 50%;
      width: 50%;
      border-radius: 40%;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b16;
      color: #ffffff;
      text-align: center;
    }header {
  padding: 40px 20px;
}

header h1 {
  font-size: 3rem;
  color: #f3a9ff;
  letter-spacing: 2px;
}

.order-section {
  max-width: 700px;
  margin: 40px auto;
  padding: 30px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
  text-align: left;
}

.order-section h2 {
  font-size: 2rem;
  color: #8be8ff;
  margin-bottom: 20px;
  text-align: center;
}

label {
  font-size: 1.1rem;
  color: #ffd7ff;
}

select, input {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  margin-bottom: 20px;
  background: rgba(255, 255, 255, 0.1);
  border:1px solid #ff3ebf;
  border-radius: 10px;
  color: #070606;
  font-size: 1rem;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 1.2rem;
  background: #ff74ff;
  border: none;
  border-radius: 12px;
  color: #0b0b16;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff9bff;
}

  </style>
</head>
<body>
  <header>
    <h1>Order Your Cosmic Tea</h1>
    <p>Customize your cup for a perfect galactic experience</p>
   <img src="icecream.jpg">
  </header>  <section class="order-section">
    <h2>Order Form</h2><label for="coffeeType">Select Tea Type</label>
<select id="coffeeType">
  <option value="Galactic Espresso">Galactic Espresso</option>
  <option value="Cosmic Cappuccino">Cosmic Cappuccino</option>
  <option value="Nebula Latte">Nebula Latte</option>
   <option value="Nebula Latte">Nebula Latte with black Chocolate</option>
  <option value="Galactic Espresso">Galactic Espresso</option>
  <option value="Cosmic Cappuccino">Cosmic Cappuccino</option>
</select>

<label for="size">Choose Size</label>
<select id="size">
  <option value="1 Spone">1 Spone</option>
  <option value="2 Spone">2 Spone</option>
  <option value="3 Spone">3 Spone</option>
</select>

<label for="addons">Add-ons (Optional)</label>
<select id="addons">
  <option value="None">None</option>
  <option value="Extra Sugar">Extra Sugar</option>
  <option value="Extra Foam">Extra Foam</option>
  <option value="Vanilla Flavor">Vanilla Flavor</option>
  <option value="Caramel Drizzle">Caramel Drizzle</option>
</select>

<label for="quantity">Quantity</label>
<input type="number" id="quantity" min="1" value="1" />
<label for="number">Presonal number</label>
<input type="number" id="number" min="1" value="1" />

<button>Place Order</button>

  </section>
</body>
</html>
