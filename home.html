<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Cafe</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-image: url("background.png");
            background-size: contain;
            font-family: 'Times New Roman', Times, serif;
        }
        .navbar{
            height: 110px;
            width: 100%;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo{
            background-image: url("logo.jpeg");
            background-size: cover;
            background-position: center;
            height: 90px;
            width: 90px;
            border-radius: 50%;
        }

        .pages a{
            text-decoration: none;
            color: white;
            margin: 0 20px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .pages a:hover{
            color: #7cc9ff;
            text-shadow: 0 0 10px #7cc9ff;
        }
        h1{
            text-align: center;
            color: white;
            margin-top: 70px;
            font-size: 55px;
            text-shadow: 0 0 15px #33aaff;
        }
        .btn-container{
            text-align: center;
            margin-top: 10px;
        }

        .btn{
            padding: 15px 35px;
            margin: 10px;
            font-size: 20px;
            color: white;
            border: 2px solid #33aaff;
            border-radius: 30px;
            background-color: black;
            transition: 0.3s;
        }

        .btn:hover{
            background-color: #33aaff;
            color: black;
            box-shadow: 0 0 20px #33aaff;
        }

        .intro{
            margin-top: 30px;
            text-align: center;
            color: #d9e6ff;
            font-size: 22px;
            padding: 40px;}
        .card-container{
            display: flex;
        justify-content: center;
     gap: 30px;
    margin-top: 40px;
    padding-bottom: 50px;
}
    .card {
    background: rgba(0, 0, 0, 0.45);
    padding: 20px;
    border-radius: 15px;
    color: #e6e6e6;
    font-size: 17px;
    border: 1px solid #ff3ebf;
    box-shadow: 0 0 15px #ff3ebf;
}



    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"></div>

        <div class="pages">
            <a href="menu.html">MENU</a>
            <a href="service.html">SERVICES</a>
            <a href="about.html">ABOUT</a>
            <a href="feedback.html">FEEDBACK</a>
        </div>
    </div>
    <div class="card-container">

    <div class="card">
        <div class="card-title"> Galaxy Special</div>
        <div class="card-text">Taste the cosmic flavors of the universe.</div>
    </div>

    <div class="card">
        <div class="card-title"> Cosmic Brew</div>
        <div class="card-text">A drink crafted for the stars within you.</div>
    </div>

</div>


    <h1>WELCOME TO SPACE CAFE</h1>


    </div>
</body>
</html>
