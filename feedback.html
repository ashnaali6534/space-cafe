<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
      <style>
        body {
            background-image: url("background.png");
            background-size: cover;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 50%;
            background: rgba(0, 0, 0, 0.6);
            margin: 70px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px #ff00cc;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ff00cc;
        }

        label {
            font-size: 18px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: none;
           
        }

        textarea {
            height: 120px;
        }

        .rating {
            margin-bottom: 20px;
        }

        .rating label {
            margin-right: 15px;
        }

        .btn {
            width: 100%;
            font-size: 18px;
            padding: 12px;
            border-radius: 25px;
            background: black;
            border: 2px solid #ff00cc;
            color: white;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff00cc;
            color: black;
            box-shadow: 0 0 20px #ff00cc;
        }
    </style>
</head>
<body>
     <div class="container">
        <h1>Give Us Your Feedback</h1>
          <label>Your Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>
            <label>Your Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label>Rate Your Experience:</label>
        <form onsubmit="return validateForm()">
   <div class="rating">
    <label><input type="radio" name="rate" value="Excellent" >Excellent</label>
    <label><input type="radio" name="rate" value="Good" >Good</label>
    <label><input type="radio" name="rate" value="Average" >Average</label>
    <label><input type="radio" name="rate" value="Poor" >Poor</label>
   </div>
    <label>Your Feedback:</label>
            <textarea id="message" placeholder="your feedback"></textarea>
            <button class="btn" type="submit">Submit Feedback</button>
        </form>
    </div>
     <script>
        function validateForm() {
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message").value.trim();

            if (name === "" || email === "" || message === "") {
                alert("Please fill all fields before submitting!");
                return false;
            }

            alert("Thank you for your feedback!");
            return true;
        }
    </script>

</body>
</html>
